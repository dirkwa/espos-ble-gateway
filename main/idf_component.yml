## espos-ble-gateway app manifest. The ESP32-P4 has no radio of its own: WiFi
## and Bluetooth both reach an ESP32-C6 co-processor over SDIO via esp_hosted.
dependencies:
  idf: ">=6.0.0"
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: "^2.12.0"
    rules:
      - if: "target == esp32p4"
