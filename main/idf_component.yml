## espos-ble-gateway app manifest. The ESP32-P4 has no radio of its own: WiFi
## and Bluetooth both reach an ESP32-C6 co-processor over SDIO via esp_hosted,
## behind the esp_wifi_remote shim.
##
## Neither is named here. espos_wifi declares and pins both, this firmware
## calls neither, and a copy could only disagree -- two exact pins that differ
## are a hard version solving failure, not a warning. The copy that stood here
## was `esp_wifi_remote: "*"`, which floated to whatever had been published
## most recently on the day of the build.
dependencies:
  idf: ">=6.0.0"
