#
# Build and release the BLE gateway for every chip it supports.
#
# The per-target build is espOS's reusable build-firmware.yml rather than a
# local copy: two consumers had already grown their own copies of that job and
# they had drifted, which is the whole reason the reusable one exists. It needed
# `tag` and `artifact` inputs to be callable this way (signalk-espOS/espOS#121).
#
# One release job for all targets, not one per leg: five parallel releases on
# one tag would race each other, and only an aggregate can attach every
# target's assets to the same tag.
name: Build & release firmware

on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag to build, sign and attach assets to"
        type: string
        required: true
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to build and attach assets to. Required: without
          it the reusable workflow sees an empty tag, skips restoring the
          signing key, stages nothing, and the release job below is skipped --
          a manual run that appears to succeed and produces nothing.
        type: string
        required: true

permissions:
  contents: read

jobs:
  firmware:
    strategy:
      # One board per chip, so a chip failing to build should still yield the
      # others rather than leaving a release with no assets. The release job
      # below still requires them all, so a partial build does not ship.
      fail-fast: false
      matrix:
        target: [esp32p4, esp32c5, esp32c6, esp32c3, esp32s3, esp32]
    # @main, matching what espOS documents for this workflow (docs/releasing.md
    # and the workflow's own header). Every THIRD-PARTY action in this repo is
    # SHA-pinned, and that asymmetry is deliberate:
    #
    #   - signalk-espOS/espOS has one collaborator, the same person who holds
    #     this repository's signing key. A SHA would only guard against someone
    #     who can push to espOS main -- and anyone who can do that can already
    #     use the key directly, so it buys nothing here that is not already
    #     lost. The forwarded signing_key does not change that.
    #   - The espOS SUBMODULE is pinned to a tag independently, so what gets
    #     compiled is fixed; only the build recipe floats.
    #   - A shared workflow exists so a fix reaches every consumer. Pinning a
    #     SHA per consumer reintroduces exactly the drift it was written to
    #     remove -- two consumers had already grown divergent copies once.
    #
    # Revisit if espOS gains collaborators who should not be able to sign this
    # firmware, or if it starts tagging the workflow separately.
    uses: signalk-espOS/espOS/.github/workflows/build-firmware.yml@main
    with:
      target: ${{ matrix.target }}
      # The chip is in the name because these images are NOT interchangeable
      # and a device cannot tell them apart: espOS matches an update on app,
      # target and channel.
      name: ble-gateway-${{ matrix.target }}
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      # Distinct per leg: two legs uploading one artifact name is an error on
      # upload-artifact v4+.
      artifact: firmware-${{ matrix.target }}
    secrets:
      # The repository secret by its own name, rather than declaring it under
      # this file's own `workflow_call.secrets`. That keeps the secret's name in
      # one place, but it has a consequence worth stating, because getting it
      # wrong yields unsigned firmware and no error anywhere:
      #
      # on the `release:` and `workflow_dispatch:` triggers the repository
      # secret is visible here directly, but on `workflow_call:` this file is a
      # CALLED workflow, and a called workflow receives no secrets unless its
      # caller forwards them. release-please.yml reaches this file on exactly
      # that trigger, so its `secrets: inherit` is what makes the key readable
      # here. It is load-bearing, not redundant -- without it the build falls
      # back to a per-run throwaway key, succeeds, and produces a release that
      # installs over USB and then refuses every OTA.
      signing_key: ${{ secrets.GATEWAY_SIGNING_KEY_PEM }}

  release:
    needs: firmware
    runs-on: ubuntu-latest
    if: inputs.tag != '' || github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # Every leg's artifact, merged into one dist/ for a single release.
          pattern: firmware-*
          merge-multiple: true
          path: dist

      - name: list what will be attached
        run: ls -l dist/

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # Named explicitly: on a workflow_call there is no release event.
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          # Fail rather than publish a release missing a chip's firmware: a
          # silently incomplete release is worse than a failed one, because the
          # registry would index it and offer owners of that chip nothing.
          fail_on_unmatched_files: true
          files: dist/*.bin

      # Publish the same images somewhere a BROWSER may read them.
      #
      # GitHub serves release downloads with no Access-Control-Allow-Origin, on
      # the 302 and on the redirect target, so a web page cannot fetch them at
      # all -- the hosted flasher could never download firmware from a release.
      # raw.githubusercontent does send `access-control-allow-origin: *` and
      # honours Range requests, so an orphan branch of this repository works as
      # a CORS-readable mirror of what the release already carries.
      #
      # Orphan and force-pushed: this branch is a publishing surface, not
      # history. Keeping every release's images would grow the clone for
      # everyone who checks this repo out, and the releases remain the archive.
      # Only the current release needs to be flashable from a browser.
      - name: mirror the images where a browser can read them
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # GitHub blocks a push containing a file over 100 MB. Fail loudly
          # rather than skip: a silent skip leaves the flasher pointing at a
          # URL that 404s, which reads as a broken release.
          for f in dist/*.bin; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt 52428800 ]; then
              echo "::error::$(basename "$f") is $size bytes; too large to serve" \
                   "from raw.githubusercontent. The flasher would 404."
              exit 1
            fi
          done

          work=$(mktemp -d)
          mkdir -p "$work/$TAG"
          cp dist/*.bin "$work/$TAG/"

          {
            echo "# Browser-readable firmware"
            echo
            echo "Generated by \`release-firmware.yml\`; do not edit or merge."
            echo
            echo "These are the same images attached to release \`$TAG\`,"
            echo "republished here because GitHub serves release downloads"
            echo "without the CORS header a web page needs to read them. The"
            echo "hosted flasher fetches them from raw.githubusercontent.com,"
            echo "which does send it."
            echo
            echo "Force-pushed on every release; holds only the current one."
            echo "The releases remain the archive."
          } > "$work/README.md"

          cd "$work"
          git init -q -b release-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "firmware for $TAG"
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${REPO}.git" \
            release-assets

          echo "published $TAG to the release-assets branch:"
          for f in dist/*.bin; do
            echo "  https://raw.githubusercontent.com/${REPO}/release-assets/${TAG}/$(basename "$f")"
          done

