name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Radio-free logic: hex codecs, the advertisement ring and its drop
  # accounting, UUID endianness, with_response defaulting. Runs first because
  # it is fast and catches the errors a firmware build cannot.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: read pinned IDF version
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"

      # IDF's linux target needs libbsd (espos/docs/development.md).
      - run: sudo apt-get update && sudo apt-get install -y libbsd-dev

      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: linux
          path: espos/test/host/espos_ble_test
          command: idf.py --preview set-target linux && idf.py build && ./build/espos_ble_test.elf

  # The config generator rejects descriptors that would not fit NVS (key names
  # are capped at 15 characters), so a bad ble.json fails here rather than at
  # someone's flash step. The generator lives inside espos_config so the
  # component is self-contained; espos/tools/espos_gen_config.py is a
  # deprecated shim.
  config-descriptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - run: |
          python3 espos/components/espos_config/tools/espos_gen_config.py \
            --schema-out /tmp/schema.json --c-out /tmp/gen.c --h-out /tmp/keys.h \
            espos/components/espos_ble/config/ble.json

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # esp32p4 is the reference board (BLE via the C6 co-processor); the
        # others exercise the native-Bluedroid path.
        target: [esp32p4, esp32, esp32s3, esp32c3, esp32c6, esp32c5]
    steps:
      # fetch-depth: 0 because the version baked into the image comes from
      # `git describe`, and checkout's default depth of 1 fetches no tags in
      # this repository or in the espOS submodule. Without it describe answers
      # with a bare hash, espos_version.cmake rejects that and falls back to
      # version.txt, so every build between two releases claims to BE that
      # release; and the build log cannot say which espOS is in the image.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: read pinned IDF version
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"

      # CMake generates a throwaway signing key when none is present, which is
      # right for CI: these images are never released. A real release must
      # restore the project key from a secret (espos/docs/ota.md) - a build
      # signed with a per-run key installs over USB and then rejects every OTA.
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: ${{ matrix.target }}
          command: idf.py build

      # The web UI is a committed bundle in espOS (no Node here); this checks
      # it was packed into the LittleFS image rather than left out silently.
      - name: check the UI made it into the image
        run: test -s build/storage.bin
