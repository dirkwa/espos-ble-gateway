#
# CodeRabbit configuration for the BLE gateway.
# Schema: https://coderabbit.ai/integrations/schema.v2.json

language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  poem: false
  in_progress_fortune: false
  auto_review:
    enabled: false
    drafts: false
    # release-please PRs only move version.txt and CHANGELOG.md; the
    # substantive change was reviewed on its own PR.
    ignore_title_keywords:
      - "chore: release"
      - "[skip review]"
  # The espos submodule is reviewed in espOS, and the component manager's
  # checkout is never authored here.
  path_filters:
    - "!espos/**"
    - "!managed_components/**"
    - "!dependencies.lock"
